name: Pruebas - Producto

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas con unittest
        run: python -m unittest discover -s tests -v

      - name: Generar reporte de resultados
        run: python tests/test_producto.py
