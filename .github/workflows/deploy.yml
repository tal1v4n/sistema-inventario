name: Despliegue del Sistema de Inventario

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión publicada en GitHub Releases (ej. v1.0.2, v1.1.0)"
        required: true
        default: "v1.1.0"
      simular_falla:
        description: "Simular una falla para probar la recuperación"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      RELEASE_ASSET: sistema-inventario-${{ inputs.version }}.zip
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

    steps:
      - name: Validar el nombre de la versión
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La versión debe tener el formato vX.Y.Z"
            exit 1
          fi

      - name: Descargar scripts de despliegue
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Descargar el artefacto publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,publishedAt,assets \
            --jq '"Versión: \(.tagName)\nPublicada: \(.publishedAt)\nArchivos: \([.assets[].name] | join(", "))"'
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET" \
            --clobber

      - name: Comprobar el paquete
        run: |
          unzip -t "$RELEASE_ASSET"
          unzip -l "$RELEASE_ASSET"
          sha256sum "$RELEASE_ASSET"

      # Solo se usa si el servidor es una VM local conectada con Tailscale
      - name: Conectar a la red privada (Tailscale)
        if: env.TS_AUTHKEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Transferir paquete y scripts al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "${{ env.RELEASE_ASSET }},deploy/*.sh"
          target: sistema-inventario/entrantes
          overwrite: true

      - name: Instalar y verificar la versión en el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            ls -l ~/sistema-inventario/entrantes
            bash ~/sistema-inventario/entrantes/deploy/desplegar.sh \
              "${{ env.RELEASE_TAG }}" ${{ inputs.simular_falla && '--simular-falla' || '' }}

      - name: Estado final del servidor
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: bash ~/sistema-inventario/scripts/estado.sh
